name: Daily ER Dashboard

on:
  repository_dispatch:
    types: [daily-er-scan]
  workflow_dispatch:

jobs:
  run-er:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ER dashboard
        env:
          NTFY_TOPIC: smarttrade-gex-7bfbe66211d7
        run: bash run_er_scan.sh
