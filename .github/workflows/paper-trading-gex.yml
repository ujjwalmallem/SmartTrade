name: Paper Trading - GEX

on:
  repository_dispatch:
    types: [paper-trading-gex]
  workflow_dispatch:
    inputs:
      action:
        description: "Action to run"
        type: choice
        options: [open, check, close]
        default: check

permissions:
  contents: write

concurrency:
  group: paper-trading-gex
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine action
        id: action
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "action=${{ github.event.inputs.action }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "action=${{ github.event.client_payload.action }}" >> "$GITHUB_OUTPUT"
          else
            echo "action=check" >> "$GITHUB_OUTPUT"
          fi

      - name: Run paper trading
        run: bash run_paper_trading.sh gex ${{ steps.action.outputs.action }}
