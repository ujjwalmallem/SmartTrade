name: Daily GEX Scan

on:
  repository_dispatch:
    types: [daily-gex-scan]
  workflow_dispatch:

jobs:
  run-gex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run GEX scanner
        env:
          NTFY_TOPIC: smarttrade-gex-bb4b87815d16
        run: bash run_gex_scan.sh
